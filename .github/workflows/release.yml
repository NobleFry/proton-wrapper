name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: 2.48.0
    steps:
      - uses: actions/checkout@v4

      - name: Install nfpm
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar xz nfpm
          sudo mv nfpm /usr/local/bin/

      - name: Build packages
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          nfpm pkg -p deb -t dist/
          nfpm pkg -p rpm -t dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
